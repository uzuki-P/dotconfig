# Build the signed release APK on a GitHub-hosted Linux runner.
# Signing uses the same keystore as local builds (~/.android/debug.keystore),
# stored as repo secrets, so CI APKs install as updates over local ones.
# Runs on every push to main that touches more than docs; ci-fetch.timer
# (dotconfig) downloads the artifact locally, and `just ci-apk` waits for it.
name: android-apk

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".scratch/**"]
  workflow_dispatch:

# A newer push supersedes a build still in progress.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # stage-apk stamps the staged name with `date`.
    env:
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Without keystore.properties, Gradle falls back to the runner's own
      # debug key, and the APK would not install over the existing app.
      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat > keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - uses: extractions/setup-just@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and stage APK
        run: just stage-apk

      - uses: actions/upload-artifact@v4
        with:
          name: example-app-apk
          path: _apk/*.apk
          if-no-files-found: error
          retention-days: 7
