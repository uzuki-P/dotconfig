<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>HTML response template prototype</title>
  <!-- PROTOTYPE: three HTML response directions, switchable with ?variant=a|b|c. -->
  <style>
    @font-face {
      font-family: "Maple Mono";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("https://cdn.jsdelivr.net/fontsource/fonts/maple-mono@5.3.0/latin-400-normal.woff2") format("woff2");
    }

    :root {
      color-scheme: light;
      --page: #f8f7f8;
      --surface: #f1eff1;
      --surface-raised: #fcfafb;
      --ink: #272326;
      --muted: #706970;
      --line: #ded9dd;
      --line-strong: #c7c0c5;
      --pink: #d32672;
      --pink-ink: #fff7fa;
      --pink-soft: #f8dbe8;
      --code: #211e20;
      --code-ink: #eee9ec;
      --syntax-keyword: #ff78b3;
      --syntax-string: #88d6b3;
      --syntax-number: #f5bd72;
      --syntax-type: #8fc7ff;
      --syntax-comment: #91868d;
      --syntax-meta: #c9a5ef;
      --shadow: 0 18px 50px rgb(79 53 68 / 0.12);
      --radius: 14px;
      --content: 74rem;
      --reading: 46rem;
    }

    html[data-resolved-theme="dark"] {
      color-scheme: dark;
      --page: #171416;
      --surface: #211d20;
      --surface-raised: #282327;
      --ink: #eee9ec;
      --muted: #aaa1a7;
      --line: #393238;
      --line-strong: #51464d;
      --pink: #e66a9e;
      --pink-ink: #241018;
      --pink-soft: #442333;
      --code: #100e0f;
      --code-ink: #eee9ec;
      --syntax-keyword: #ff82ba;
      --syntax-string: #8fdeb9;
      --syntax-number: #ffc477;
      --syntax-type: #91caff;
      --syntax-comment: #998d95;
      --syntax-meta: #d0aaf5;
      --shadow: 0 20px 60px rgb(0 0 0 / 0.28);
    }

    * { box-sizing: border-box; }

    html {
      background: var(--page);
      scroll-behavior: smooth;
    }

    body {
      min-width: 20rem;
      min-height: 100dvh;
      margin: 0;
      overflow-x: hidden;
      background: var(--page);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-rendering: optimizeLegibility;
    }

    button, a { -webkit-tap-highlight-color: transparent; }

    button {
      border: 0;
      font: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--pink) 65%, transparent);
      outline-offset: 3px;
    }

    .page {
      width: min(calc(100% - 2rem), var(--content));
      margin-inline: auto;
      padding: clamp(4.5rem, 9vw, 8rem) 0 9rem;
    }

    .reading { max-width: var(--reading); }

    .kicker {
      margin: 0 0 1.25rem;
      color: var(--pink);
      font-family: "Maple Mono", ui-monospace, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      max-width: 14ch;
      margin-bottom: 1.35rem;
      font-size: clamp(2.75rem, 8vw, 6.5rem);
      font-weight: 650;
      letter-spacing: -0.065em;
      line-height: 0.96;
    }

    h2 {
      margin-bottom: 1rem;
      font-size: clamp(1.75rem, 4vw, 3rem);
      font-weight: 620;
      letter-spacing: -0.045em;
      line-height: 1.04;
    }

    h3 {
      margin-bottom: 0.65rem;
      font-size: 1rem;
      font-weight: 650;
    }

    p {
      max-width: 65ch;
      color: var(--muted);
      font-size: clamp(1rem, 1.5vw, 1.12rem);
      line-height: 1.72;
    }

    .lede {
      max-width: 48ch;
      margin-bottom: 0;
      font-size: clamp(1.08rem, 2vw, 1.35rem);
    }

    .hero {
      min-height: min(72dvh, 46rem);
      display: grid;
      align-content: center;
    }

    .section {
      padding-block: clamp(4rem, 9vw, 8rem);
    }

    .hairline {
      border-top: 1px solid var(--line);
    }

    .callout {
      max-width: var(--reading);
      padding: 1.2rem 1.35rem;
      border-left: 3px solid var(--pink);
      background: var(--pink-soft);
      color: var(--ink);
      font-size: 0.98rem;
      line-height: 1.65;
    }

    .callout strong { color: var(--pink); }

    .code-block {
      position: relative;
      overflow: auto;
      border: 1px solid color-mix(in srgb, var(--code-ink) 12%, transparent);
      border-radius: var(--radius);
      background: var(--code);
      box-shadow: var(--shadow);
      color: var(--code-ink);
    }

    pre {
      margin: 0;
      padding: 1.5rem;
      font-family: "Maple Mono", "Maple Mono NF CN", ui-monospace, monospace;
      font-size: 0.84rem;
      line-height: 1.75;
      tab-size: 2;
    }

    code { font-family: "Maple Mono", "Maple Mono NF CN", ui-monospace, monospace; }

    .hljs-keyword,
    .hljs-selector-tag,
    .hljs-literal,
    .hljs-built_in { color: var(--syntax-keyword); }

    .hljs-string,
    .hljs-regexp,
    .hljs-template-tag,
    .hljs-template-variable { color: var(--syntax-string); }

    .hljs-number,
    .hljs-symbol,
    .hljs-bullet { color: var(--syntax-number); }

    .hljs-title,
    .hljs-title.class_,
    .hljs-title.function_,
    .hljs-type,
    .hljs-variable.language_ { color: var(--syntax-type); }

    .hljs-comment,
    .hljs-quote { color: var(--syntax-comment); font-style: italic; }

    .hljs-meta,
    .hljs-attr,
    .hljs-attribute,
    .hljs-property { color: var(--syntax-meta); }

    .hljs-punctuation,
    .hljs-params,
    .hljs-variable { color: var(--code-ink); }

    .copy-code {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      z-index: 2;
      min-width: 4.5rem;
      padding: 0.48rem 0.72rem;
      border: 1px solid rgb(255 255 255 / 0.15);
      border-radius: 8px;
      background: rgb(255 255 255 / 0.08);
      color: var(--code-ink);
      font-family: "Maple Mono", ui-monospace, monospace;
      font-size: 0.72rem;
      cursor: pointer;
    }

    .copy-code:active { transform: translateY(1px); }

    .diagram-block { margin-top: 2rem; }

    .diagram-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.85rem;
    }

    .diagram-heading h3 { margin: 0; }

    .diagram-hint {
      margin: 0;
      font-family: "Maple Mono", ui-monospace, monospace;
      font-size: 0.7rem;
      line-height: 1.4;
    }

    .diagram-shell {
      position: relative;
      overflow: hidden;
      min-height: 29rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background-color: var(--surface-raised);
      background-image: radial-gradient(var(--line) 0.7px, transparent 0.7px);
      background-size: 18px 18px;
      box-shadow: var(--shadow);
    }

    .diagram-canvas {
      width: 100%;
      height: 29rem;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .diagram-canvas.dragging { cursor: grabbing; }

    .diagram-canvas svg {
      display: block;
      width: 100%;
      height: 100%;
      max-width: none !important;
    }

    .diagram-tools {
      position: absolute;
      right: 0.8rem;
      bottom: 0.8rem;
      z-index: 3;
      display: flex;
      flex-wrap: wrap;
      justify-content: end;
      gap: 0.35rem;
      max-width: calc(100% - 1.6rem);
      padding: 0.35rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: color-mix(in srgb, var(--surface-raised) 92%, transparent);
      box-shadow: 0 8px 24px rgb(50 33 43 / 0.1);
      backdrop-filter: blur(12px);
    }

    .tool-button {
      min-height: 2.25rem;
      padding: 0.4rem 0.7rem;
      border-radius: 7px;
      background: transparent;
      color: var(--ink);
      font-family: "Maple Mono", ui-monospace, monospace;
      font-size: 0.72rem;
      cursor: pointer;
    }

    .tool-button:hover { background: var(--surface); }
    .tool-button:active { transform: translateY(1px); }
    .tool-button.primary { background: var(--pink); color: var(--pink-ink); }

    .diagram-error {
      display: grid;
      min-height: 29rem;
      place-items: center;
      padding: 2rem;
      color: var(--pink);
      font-family: "Maple Mono", ui-monospace, monospace;
      text-align: center;
    }

    .theme-picker {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 20;
      display: flex;
      gap: 0.25rem;
      padding: 0.3rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: color-mix(in srgb, var(--surface-raised) 90%, transparent);
      box-shadow: 0 8px 24px rgb(50 33 43 / 0.1);
      backdrop-filter: blur(14px);
    }

    .theme-picker button {
      display: grid;
      width: 2.15rem;
      height: 2.15rem;
      padding: 0;
      place-items: center;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .theme-picker button:hover {
      background: var(--surface);
      color: var(--ink);
    }

    .theme-picker svg {
      width: 1.05rem;
      height: 1.05rem;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .theme-picker button[aria-pressed="true"] {
      background: var(--pink);
      color: var(--pink-ink);
    }

    .prototype-switcher {
      position: fixed;
      left: 50%;
      bottom: 1rem;
      z-index: 30;
      display: grid;
      grid-template-columns: 2.6rem minmax(12rem, auto) 2.6rem;
      align-items: center;
      padding: 0.35rem;
      border: 1px solid color-mix(in srgb, var(--ink) 14%, transparent);
      border-radius: 999px;
      background: var(--ink);
      box-shadow: 0 14px 36px rgb(22 16 20 / 0.25);
      color: var(--page);
      transform: translateX(-50%);
    }

    .prototype-switcher button {
      width: 2.35rem;
      height: 2.35rem;
      border-radius: 999px;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    .prototype-switcher button:hover { background: rgb(255 255 255 / 0.12); }

    .variant-label {
      padding-inline: 0.7rem;
      font-family: "Maple Mono", ui-monospace, monospace;
      font-size: 0.72rem;
      text-align: center;
      white-space: nowrap;
    }

    dialog {
      width: calc(100vw - 2rem);
      max-width: none;
      height: calc(100dvh - 2rem);
      max-height: none;
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface-raised);
      color: var(--ink);
    }

    dialog::backdrop { background: rgb(15 11 14 / 0.72); backdrop-filter: blur(5px); }

    .dialog-stage,
    .dialog-stage .diagram-shell,
    .dialog-stage .diagram-canvas { width: 100%; height: 100%; }

    .dialog-stage .diagram-shell { min-height: 100%; border: 0; border-radius: 0; box-shadow: none; }

    .dialog-close {
      position: fixed;
      top: 1.8rem;
      right: 1.8rem;
      z-index: 5;
      padding: 0.55rem 0.8rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-raised);
      color: var(--ink);
      font-family: "Maple Mono", ui-monospace, monospace;
      font-size: 0.72rem;
      cursor: pointer;
    }

    .variant-a .narrative { margin-left: clamp(0rem, 8vw, 9rem); }
    .variant-a .diagram-block { width: min(86vw, 70rem); margin-left: min(8vw, 9rem); }

    .variant-b .hero {
      min-height: auto;
      padding: clamp(4rem, 9vw, 8rem) 0 clamp(2rem, 4vw, 4rem);
    }

    .variant-b .split {
      display: grid;
      grid-template-columns: minmax(15rem, 0.8fr) minmax(0, 1.5fr);
      gap: clamp(2rem, 6vw, 7rem);
      align-items: start;
      padding-block: clamp(3rem, 6vw, 6rem);
      border-top: 1px solid var(--line);
    }

    .variant-b .split-copy { position: sticky; top: 6rem; }
    .variant-b .split .diagram-block { margin-top: 0; }

    .facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      margin-top: 2rem;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--line);
    }

    .fact { padding: 1rem; background: var(--surface-raised); }
    .fact span { display: block; color: var(--muted); font-size: 0.78rem; }
    .fact strong { display: block; margin-top: 0.3rem; font-family: "Maple Mono", ui-monospace, monospace; font-size: 0.9rem; }

    .variant-c { --content: 82rem; }

    .variant-c .hero {
      min-height: auto;
      max-width: 58rem;
      padding-block: clamp(5rem, 11vw, 10rem) clamp(3rem, 6vw, 6rem);
    }

    .notebook {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(20rem, 0.9fr);
      gap: 1.25rem;
      align-items: stretch;
    }

    .notebook > * { min-width: 0; }

    .note-panel {
      padding: clamp(1.3rem, 3vw, 2.25rem);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-raised);
    }

    .note-panel p:last-child { margin-bottom: 0; }
    .variant-c .diagram-block { margin: 1.25rem 0 0; }
    .variant-c .code-block { height: 100%; min-height: 29rem; box-shadow: none; }

    @media (max-width: 800px) {
      .page { width: min(calc(100% - 1.25rem), var(--content)); padding-top: 5.5rem; }
      .hero { min-height: 62dvh; }
      .variant-a .narrative,
      .variant-a .diagram-block { width: auto; margin-left: 0; }
      .variant-b .split,
      .notebook { grid-template-columns: 1fr; }
      .variant-b .split-copy { position: static; }
      .diagram-heading { align-items: start; flex-direction: column; }
      .diagram-shell, .diagram-canvas { min-height: 23rem; height: 23rem; }
      .theme-picker { right: 0.65rem; top: 0.65rem; }
      .prototype-switcher { bottom: 0.65rem; grid-template-columns: 2.5rem minmax(9.5rem, auto) 2.5rem; }
      .variant-label { font-size: 0.65rem; padding-inline: 0.35rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }

    /* Dense decision-document prototype overrides. */
    .dense-doc.page {
      width: min(calc(100% - 2rem), 82rem);
      padding: 2.5rem 0 6rem;
    }

    .dense-doc .hero {
      min-height: 0;
      padding: 0 0 1.25rem;
      border-bottom: 1px solid var(--line);
    }

    .dense-doc h1 {
      max-width: 24ch;
      margin-bottom: 0.65rem;
      font-size: clamp(2rem, 4vw, 3.5rem);
      letter-spacing: -0.045em;
      line-height: 1;
    }

    .dense-doc h2 {
      margin-bottom: 0.65rem;
      font-size: clamp(1.25rem, 2vw, 1.65rem);
      letter-spacing: -0.025em;
      line-height: 1.15;
    }

    .dense-doc h3 { margin-bottom: 0.45rem; font-size: 0.98rem; }
    .dense-doc p, .dense-doc li { font-size: 0.98rem; line-height: 1.66; }
    .dense-doc p {
      max-width: none;
      margin-bottom: 0.9rem;
      hyphens: auto;
      overflow-wrap: break-word;
      text-align: justify;
      text-justify: inter-word;
    }
    .dense-doc .lede { max-width: 92ch; font-size: 1.08rem; line-height: 1.62; }
    .dense-doc .kicker { margin-bottom: 0.65rem; font-size: 0.67rem; }

    .dense-doc .kicker,
    .dense-doc .section-head p,
    .dense-doc .model-note,
    .dense-doc .diagram-hint,
    .dense-doc .code-caption p,
    .dense-doc .pull-quote { text-align: left; }

    .dense-section {
      padding: 1.4rem 0;
      border-bottom: 1px solid var(--line);
    }

    .dense-section:last-child { border-bottom: 0; }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.65rem;
    }

    .section-head h2, .section-head p { margin-bottom: 0; }
    .section-head p { max-width: 56ch; font-size: 0.76rem; text-align: right; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      margin-top: 1rem;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--line);
    }

    .summary-item {
      min-width: 0;
      padding: 0.85rem;
      background: var(--surface-raised);
    }

    .summary-item span {
      display: block;
      color: var(--muted);
      font-family: "Maple Mono", ui-monospace, monospace;
      font-size: 0.65rem;
      line-height: 1.35;
    }

    .summary-item strong {
      display: block;
      margin-top: 0.3rem;
      color: var(--ink);
      font-size: 1rem;
      letter-spacing: -0.02em;
    }

    .summary-item strong.pink { color: var(--pink); }

    .dense-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      align-items: start;
    }

    .dense-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .compact-panel {
      min-width: 0;
      padding: 0.9rem 1rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-raised);
    }

    .compact-panel p:last-child, .compact-panel ul:last-child { margin-bottom: 0; }

    .table-wrap {
      width: 100%;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-raised);
    }

    table {
      width: 100%;
      min-width: 47rem;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    th, td {
      padding: 0.58rem 0.65rem;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.35;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: var(--surface);
      color: var(--ink);
      font-family: "Maple Mono", ui-monospace, monospace;
      font-size: 0.67rem;
      font-weight: 600;
      white-space: nowrap;
    }

    tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: color-mix(in srgb, var(--pink-soft) 28%, transparent); }
    td.numeric, th.numeric { text-align: right; white-space: nowrap; }
    td.emphasis { color: var(--ink); font-weight: 650; }
    td.recommend { color: var(--pink); font-weight: 650; }

    .model-note {
      margin-top: 0.55rem;
      padding-left: 0.8rem;
      border-left: 2px solid var(--pink);
      color: var(--muted);
      font-size: 0.72rem !important;
    }

    .dense-list {
      display: grid;
      gap: 0.45rem;
      margin: 0;
      padding-left: 1.1rem;
      color: var(--muted);
    }

    .verdict {
      padding: 1rem 1.1rem;
      border: 1px solid color-mix(in srgb, var(--pink) 36%, var(--line));
      border-radius: var(--radius);
      background: var(--pink-soft);
    }

    .verdict p { color: var(--ink); }
    .verdict p:last-child { margin-bottom: 0; }

    .source-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.45rem 1rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .source-list a {
      color: var(--pink);
      font-size: 0.74rem;
      text-decoration-color: color-mix(in srgb, var(--pink) 36%, transparent);
      text-underline-offset: 0.18em;
    }

    .dense-doc .diagram-block { width: auto; margin: 0; }
    .dense-doc .diagram-shell, .dense-doc .diagram-canvas { min-height: 20rem; height: 20rem; }
    .dense-doc .diagram-heading { margin-bottom: 0.55rem; }
    .dense-doc .diagram-hint { font-size: 0.65rem; }

    .prose-flow {
      display: grid;
      gap: 1rem;
      max-width: none;
    }

    .prose-flow.wide { max-width: none; }
    .prose-flow p { margin: 0; }
    .prose-flow strong { color: var(--ink); }

    .text-columns {
      columns: 2 22rem;
      column-gap: 2.25rem;
    }

    .text-columns p { break-inside: avoid; }
    .text-columns .prose-flow { display: block; }
    .text-columns .prose-flow p { margin-bottom: 1rem; }

    .pull-quote {
      max-width: 48ch;
      margin: 1.2rem 0;
      padding: 0.2rem 0 0.2rem 1rem;
      border-left: 3px solid var(--pink);
      color: var(--ink);
      font-size: clamp(1rem, 1.8vw, 1.25rem);
      font-weight: 620;
      letter-spacing: -0.02em;
      line-height: 1.45;
    }

    .chart-shell {
      padding: 0.9rem 1rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-raised);
    }

    .chart-shell svg {
      display: block;
      width: 100%;
      height: auto;
      min-height: 18rem;
      overflow: visible;
    }

    .chart-grid { stroke: var(--line); stroke-width: 1; }

    function economicsNarrative() {
      return `<div class="prose-flow wide">

          <section class="dense-section"><h2>The decision in plain language</h2><p>For an omnichannel CRM serving between thirty and three hundred concurrently active support agents, Convex Cloud Professional is the sensible default. It is cheaper in the modeled workload, has substantial session headroom, and removes the need to operate the realtime backend, its upgrades, daily backup machinery, log pipeline, and exception reporting. At one thousand agents, the cloud usage estimate approaches the infrastructure subtotal of a serious self-hosted deployment, but self-hosting still carries a large operational cost unless an existing platform team can absorb it.</p><p class="pull-quote">Self-hosting becomes compelling when control solves a real constraint: regional latency, data residency, private networking, or an established operations capability.</p><p>The conclusion is not based on the idea that managed services are always better. It comes from separating three questions that are easily collapsed: what Convex charges, what infrastructure costs, and what reliable operation requires. Object storage is inexpensive. A durable, observable, recoverable realtime CRM is not.</p></section>

    function setupPanZoom(canvas) {
      const svg = canvas.querySelector("svg");
      const shell = canvas.closest(".diagram-shell");
      const original = svg.viewBox.baseVal;
      const base = { x: original.x, y: original.y, width: original.width, height: original.height };
      let view = { ...base };
      let drag = null;

      function apply() {
        svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.width} ${view.height}`);
      }

      function zoom(factor, clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const px = clientX == null ? 0.5 : (clientX - rect.left) / rect.width;
        const py = clientY == null ? 0.5 : (clientY - rect.top) / rect.height;
        const nextWidth = Math.min(base.width * 4, Math.max(base.width * 0.18, view.width * factor));
        const nextHeight = nextWidth * (view.height / view.width);
        view.x += (view.width - nextWidth) * px;
        view.y += (view.height - nextHeight) * py;
        view.width = nextWidth;
        view.height = nextHeight;
        apply();
      }

      canvas.addEventListener("wheel", (event) => {
        event.preventDefault();
        zoom(event.deltaY > 0 ? 1.12 : 0.89, event.clientX, event.clientY);
      }, { passive: false });

      canvas.addEventListener("pointerdown", (event) => {
        drag = { x: event.clientX, y: event.clientY, viewX: view.x, viewY: view.y };
        canvas.setPointerCapture(event.pointerId);
        canvas.classList.add("dragging");
      });

      canvas.addEventListener("pointermove", (event) => {
        if (!drag) return;
        const rect = canvas.getBoundingClientRect();
        view.x = drag.viewX - (event.clientX - drag.x) * view.width / rect.width;
        view.y = drag.viewY - (event.clientY - drag.y) * view.height / rect.height;
        apply();
      });

      function stopDrag() {
        drag = null;
        canvas.classList.remove("dragging");
      }

      canvas.addEventListener("pointerup", stopDrag);
      canvas.addEventListener("pointercancel", stopDrag);

      shell.querySelector("[data-action='in']").addEventListener("click", () => zoom(0.8));
      shell.querySelector("[data-action='out']").addEventListener("click", () => zoom(1.25));
      shell.querySelector("[data-action='reset']").addEventListener("click", () => {
        view = { ...base };
        apply();
      });
      shell.querySelector("[data-action='fullscreen']").addEventListener("click", () => openFullscreen(shell));
      apply();
    }

    function openFullscreen(shell) {
      restoreTarget = shell.previousElementSibling;
      dialogStage.append(shell);
      dialog.showModal();
    }

    function closeFullscreen() {
      if (restoreTarget && dialogStage.firstElementChild) {
        restoreTarget.after(dialogStage.firstElementChild);
      }
      restoreTarget = null;
      dialog.close();
    }

    function setupCopy() {
      document.querySelectorAll(".copy-code").forEach((button) => {
        button.addEventListener("click", async () => {
          try {
            const code = button.closest(".code-block")?.querySelector("code")?.textContent || codeSample;
            await navigator.clipboard.writeText(code);
            button.textContent = "Copied";
            setTimeout(() => { button.textContent = "Copy"; }, 1400);
          } catch {
            button.textContent = "Unavailable";
          }
        });
      });
    }

    async function render() {
      if (dialog.open) closeFullscreen();
      const variant = selectedVariant();
      document.documentElement.dataset.theme = selectedTheme();
      document.documentElement.dataset.resolvedTheme = resolvedTheme();
      document.querySelectorAll("[data-theme]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.theme === selectedTheme()));
      });
      document.querySelector("#variant-label").textContent = variant.label;
      const renderers = { a: variantA, b: variantB, c: variantC, d: variantD, e: variantE };
      app.innerHTML = renderers[variant.key]();
      setupCopy();
      await renderDiagram();
    }

    function cycleVariant(direction) {
      const current = variants.findIndex((variant) => variant.key === selectedVariant().key);
      const next = (current + direction + variants.length) % variants.length;
      setQuery("variant", variants[next].key);
    }

    document.querySelectorAll("[data-theme]").forEach((button) => {
      button.addEventListener("click", () => setQuery("theme", button.dataset.theme));
    });
    document.querySelector("#previous-variant").addEventListener("click", () => cycleVariant(-1));
    document.querySelector("#next-variant").addEventListener("click", () => cycleVariant(1));
    document.querySelector("#dialog-close").addEventListener("click", closeFullscreen);
    dialog.addEventListener("cancel", (event) => { event.preventDefault(); closeFullscreen(); });
    media.addEventListener("change", () => { if (selectedTheme() === "system") render(); });
    window.addEventListener("keydown", (event) => {
      const active = document.activeElement;
      const typing = active && (active.matches("input, textarea") || active.isContentEditable);
      if (typing || dialog.open) return;
      if (event.key === "ArrowLeft") cycleVariant(-1);
      if (event.key === "ArrowRight") cycleVariant(1);
    });

    render();
  </script>
</body>
</html>
