<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="{{DOCUMENT_SUMMARY}}">
  <script>
    try {
      const t = localStorage.getItem("html-response-theme");
      const theme = ["light", "dark"].includes(t) ? t : "system";
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.resolvedTheme = theme === "system"
        ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : theme;
    } catch {}
  </script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/document.css?v=15">
  <title>{{DOCUMENT_TITLE}}</title>
</head>
<body>
  <main class="document">
    <section class="hero">
      <p class="kicker">{{DOCUMENT_KICKER}}</p>
      <h1>{{DOCUMENT_TITLE}}</h1>
    </section>
    <!-- DOCUMENT_CONTENT -->
  </main>
  <script type="module" src="/assets/document.js?v=15"></script>
</body>
</html>
