<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      const t = localStorage.getItem("html-response-theme");
      const theme = ["light", "dark"].includes(t) ? t : "system";
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.resolvedTheme = theme === "system"
        ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : theme;
    } catch {}
  </script>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/document.css?v={{ASSET_VERSION}}">
  <link rel="stylesheet" href="./assets/catalog.css?v={{ASSET_VERSION}}">
  <title>Published HTML</title>
</head>
<body>
  <main class="catalog">
    <header class="catalog-head">
      <div>
        <h1>Published HTML</h1>
        <p class="catalog-summary" id="catalog-summary">{{DOCUMENT_COUNT}} documents</p>
      </div>
      <button class="icon-button" type="button" id="theme-toggle" aria-label="Theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      </button>
    </header>

    <div class="catalog-controls">
      <div class="tabs" role="tablist" aria-label="Document sets">
        <button role="tab" type="button" id="tab-library" aria-selected="true" aria-controls="results" data-view="library">Library <span class="count" id="count-library">0</span></button>
        <button role="tab" type="button" id="tab-archive" aria-selected="false" aria-controls="results" data-view="archive">Archive <span class="count" id="count-archive">0</span></button>
      </div>
      <div class="filters" role="search">
        <label class="search">
          <span class="visually-hidden">Search documents</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
          <input id="search" type="search" placeholder="Search titles, summaries, IDs" autocomplete="off" spellcheck="false">
          <kbd aria-hidden="true">/</kbd>
        </label>
        <label class="select">
          <span class="visually-hidden">Sort documents</span>
          <select id="sort">
            <option value="created-desc">Newest first</option>
            <option value="created-asc">Oldest first</option>
            <option value="updated-desc">Recently updated</option>
            <option value="title-asc">Title A to Z</option>
          </select>
        </label>
        <div class="segmented" role="group" aria-label="Layout">
          <button type="button" data-layout="rows" aria-pressed="true" title="Rows" aria-label="Show as rows">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="6" height="5" rx="1"/><rect x="3" y="15" width="6" height="5" rx="1"/><path d="M12 6.5h9M12 17.5h9"/></svg>
          </button>
          <button type="button" data-layout="tiles" aria-pressed="false" title="Tiles" aria-label="Show as tiles">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
          </button>
        </div>
      </div>
    </div>

    <p class="results-status" id="results-status" aria-live="polite"></p>
    <div id="results" role="tabpanel" aria-labelledby="tab-library"></div>
  </main>

  <div class="toast-region" aria-live="polite"></div>
  <script type="application/json" id="catalog-data">{{CATALOG_DATA}}</script>
  <script type="module" src="./assets/catalog.js?v={{ASSET_VERSION}}"></script>
</body>
</html>
