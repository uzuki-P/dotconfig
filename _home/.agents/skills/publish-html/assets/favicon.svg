<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">Document preview</title>
  <desc id="description">A compact document page with a folded corner and three content lines.</desc>
  <style>
    .tile { fill: #f8dbe8; }
    .page { fill: #fffafb; stroke: #d32672; }
    .fold { fill: #f4b9d2; stroke: #d32672; }
    .line { stroke: #6f5361; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #442333; }
      .page { fill: #282327; stroke: #e66a9e; }
      .fold { fill: #71344e; stroke: #e66a9e; }
      .line { stroke: #d6bdc8; }
    }
  </style>
  <rect class="tile" x="3" y="3" width="58" height="58" rx="15"/>
  <path class="page" d="M18 11.5h19l10 10V51a3.5 3.5 0 0 1-3.5 3.5h-25A3.5 3.5 0 0 1 15 51V15a3.5 3.5 0 0 1 3-3.5Z" stroke-width="3" stroke-linejoin="round"/>
  <path class="fold" d="M37 11.5v10h10" stroke-width="3" stroke-linejoin="round"/>
  <path class="line" d="M23 30h16M23 37h18M23 44h12" fill="none" stroke-width="3" stroke-linecap="round"/>
</svg>
